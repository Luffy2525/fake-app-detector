services:
  - type: web
    name: shieldscan
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app3:app
    envVars:
      - key: DEBUG
        value: false
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_REPORTS
        value: "500"